services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: phototochka
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d phototochka"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    volumes:
      - phototochka_media:/app/media
      - ./frontend/src/assets/images:/app/demo_images:ro
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DATABASE_URL=postgres://user:password@db:5432/phototochka
      - CORS_ALLOWED_ORIGINS=
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/opt/phototochka/frontend/dist:ro
      - ./backend/staticfiles:/opt/phototochka/backend/staticfiles:ro
      - phototochka_media:/opt/phototochka/media:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  phototochka_media:
